<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <title>Sight Words Practice</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fef6e4;
      --card: #ffffff;
      --ink: #2b2440;
      --dim: #7a7290;
      --purple: #8763e0;
      --purple-dark: #6a45c9;
      --green: #3fb27f;
      --green-dark: #2f9269;
      --red: #e8615a;
      --red-dark: #cf4941;
      --line: #ecdfc8;
      --radius: 20px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'Baloo 2', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
    }

    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .top-btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--dim);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 10px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .top-btn:hover {
      color: var(--ink);
      border-color: var(--purple);
    }

    header {
      width: 100%;
      max-width: 480px;
      text-align: center;
      margin-bottom: 18px;
    }

    h1 {
      font-size: 1.7rem;
      font-weight: 800;
      margin: 4px 0 2px;
    }

    .subtitle {
      color: var(--dim);
      font-size: 0.95rem;
      margin: 0;
    }

    .picker-row {
      width: 100%;
      max-width: 480px;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px 16px;
      margin-bottom: 18px;
    }

    .picker {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .picker label {
      font-weight: 600;
      font-size: 0.8rem;
      color: var(--dim);
      padding-left: 2px;
    }

    select {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      background: var(--card);
      border: 2px solid var(--line);
      border-radius: 12px;
      padding: 8px 14px;
    }

    main {
      width: 100%;
      max-width: 480px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
      color: var(--dim);
      font-weight: 600;
      margin-bottom: 10px;
      padding: 0 4px;
    }

    .progress .stats {
      display: flex;
      gap: 12px;
    }

    .progress .stats span {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .reset-btn {
      font-family: inherit;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 2px 0 2px 6px;
      text-decoration: underline;
    }

    .reset-btn:hover {
      color: var(--ink);
    }

    .card {
      position: relative;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: 0 6px 0 var(--line), 0 10px 24px rgba(43, 36, 64, 0.08);
      padding: 40px 24px 32px;
      min-height: 260px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 26px;
      text-align: center;
    }

    .speak-btn {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 46px;
      height: 46px;
      border-radius: 50%;
      border: none;
      background: var(--purple);
      color: white;
      font-size: 1.3rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 3px 0 var(--purple-dark);
      transition: transform 0.06s ease;
    }

    .speak-btn:active {
      transform: translateY(3px);
      box-shadow: 0 0 0 var(--purple-dark);
    }

    .word-display {
      font-size: 2.8rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: var(--purple-dark);
      min-height: 3.4rem;
      word-break: break-word;
    }

    .judge-row {
      display: flex;
      gap: 14px;
      width: 100%;
    }

    .judge-btn {
      flex: 1;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: 700;
      color: white;
      border: none;
      border-radius: 14px;
      padding: 16px 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .judge-btn.miss {
      background: var(--red);
      box-shadow: 0 5px 0 var(--red-dark);
    }

    .judge-btn.got {
      background: var(--green);
      box-shadow: 0 5px 0 var(--green-dark);
    }

    .judge-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 currentColor;
    }

    .done-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .done-emoji {
      font-size: 3.5rem;
    }

    .done-title {
      font-size: 1.5rem;
      font-weight: 800;
    }

    .done-stats {
      color: var(--dim);
      font-weight: 600;
    }

    .again-btn {
      margin-top: 8px;
      font-family: inherit;
      font-size: 1.05rem;
      font-weight: 700;
      color: white;
      background: var(--purple);
      border: none;
      border-radius: 14px;
      padding: 14px 26px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--purple-dark);
    }

    .again-btn:active {
      transform: translateY(4px);
      box-shadow: 0 1px 0 var(--purple-dark);
    }

    .status-msg {
      text-align: center;
      color: var(--dim);
      font-weight: 600;
      padding: 40px 10px;
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(43, 36, 64, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal {
      background: var(--card);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 2px solid var(--line);
    }

    .modal-header h2 {
      font-size: 1.15rem;
      margin: 0;
    }

    .modal-close {
      font-family: inherit;
      font-size: 1rem;
      font-weight: 700;
      color: var(--dim);
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px 8px;
    }

    .modal-close:hover {
      color: var(--ink);
    }

    .modal-body {
      padding: 16px 18px 20px;
      overflow-y: auto;
    }

    .modal-quarter {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 8px;
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--purple-dark);
      margin: 16px 0 8px;
    }

    .modal-quarter:first-child {
      margin-top: 0;
    }

    .modal-source-link {
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--dim);
      text-decoration: underline;
    }

    .modal-source-link:hover {
      color: var(--ink);
    }

    .modal-week {
      margin-bottom: 10px;
      padding-left: 6px;
    }

    .modal-week-label {
      font-weight: 700;
      font-size: 0.9rem;
    }

    .modal-week-date {
      font-weight: 600;
      font-size: 0.78rem;
      color: var(--dim);
    }

    .modal-week-words {
      font-size: 0.85rem;
      color: var(--dim);
      line-height: 1.4;
    }

    [hidden] {
      display: none !important;
    }
  </style>
</head>

<body>
  <div class="top-bar">
    <button class="top-btn" id="spotCheckBtn" title="Review every quarter, week, and word">📋 Review lists</button>
    <button class="top-btn" id="thisWeekBtn" title="Jump to this week">📅 This week</button>
  </div>

  <header>
    <h1>🐝 Sight Word Spelling</h1>
    <p class="subtitle">Say the word, then mark how she did.</p>
  </header>

  <div class="picker-row" id="pickerRow" hidden>
    <div class="picker">
      <label for="modeSelect">Practice by</label>
      <select id="modeSelect">
        <option value="weekly">Week</option>
        <option value="quarterly">Quarter</option>
      </select>
    </div>
    <div class="picker">
      <label for="unitSelect">Which</label>
      <select id="unitSelect"></select>
    </div>
  </div>

  <main>
    <div id="loadingMsg" class="status-msg">Loading word lists…</div>
    <div id="errorMsg" class="status-msg" hidden></div>

    <div id="quiz" hidden>
      <div class="progress">
        <span id="progressLabel"></span>
        <span class="stats">
          <span>✅ <span id="gotCount">0</span></span>
          <span>🔁 <span id="missCount">0</span></span>
          <button class="reset-btn" id="resetBtn" title="Start this list over">↺ Reset</button>
        </span>
      </div>

      <div class="card">
        <button class="speak-btn" id="speakBtn" aria-label="Say the word again">🔊</button>

        <div class="word-display" id="wordDisplay"></div>

        <div class="judge-row">
          <button class="judge-btn miss" id="missBtn">✗ Missed it</button>
          <button class="judge-btn got" id="gotBtn">✓ Got it!</button>
        </div>
      </div>
    </div>

    <div id="doneScreen" class="card done-screen" hidden>
      <div class="done-emoji">🎉</div>
      <div class="done-title">All done!</div>
      <div class="done-stats" id="doneStats"></div>
      <button class="again-btn" id="againBtn">Play this list again</button>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal">
      <div class="modal-header">
        <h2>All quarters &amp; weeks</h2>
        <button class="modal-close" id="modalClose" aria-label="Close">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <script>
    const loadingMsg = document.getElementById('loadingMsg');
    const errorMsg = document.getElementById('errorMsg');
    const pickerRow = document.getElementById('pickerRow');
    const modeSelect = document.getElementById('modeSelect');
    const unitSelect = document.getElementById('unitSelect');
    const quiz = document.getElementById('quiz');
    const progressLabel = document.getElementById('progressLabel');
    const gotCountEl = document.getElementById('gotCount');
    const missCountEl = document.getElementById('missCount');
    const wordDisplay = document.getElementById('wordDisplay');
    const speakBtn = document.getElementById('speakBtn');
    const missBtn = document.getElementById('missBtn');
    const gotBtn = document.getElementById('gotBtn');
    const doneScreen = document.getElementById('doneScreen');
    const doneStats = document.getElementById('doneStats');
    const againBtn = document.getElementById('againBtn');
    const resetBtn = document.getElementById('resetBtn');
    const spotCheckBtn = document.getElementById('spotCheckBtn');
    const thisWeekBtn = document.getElementById('thisWeekBtn');
    const modalBackdrop = document.getElementById('modalBackdrop');
    const modalBody = document.getElementById('modalBody');
    const modalClose = document.getElementById('modalClose');

    const STORAGE_KEY = 'sight-words-state-v3';

    let quarters = [];       // [{label, weeks: [{label, date, words}]}] as loaded from words.json
    let weeklyUnits = [];    // flattened {label, words, date} per week
    let quarterUnits = [];   // flattened {label, words} per quarter (all weeks combined)
    let mode = 'weekly';     // 'weekly' | 'quarterly'
    let unitIndex = 0;
    let roundQueue = [];      // words left to get right this round (shuffled)
    let currentWord = null;
    let gotCount = 0;
    let missCount = 0;
    let roundTotal = 0;
    let finished = false;

    function currentUnits() {
      return mode === 'weekly' ? weeklyUnits : quarterUnits;
    }

    function buildWeeklyUnits(quarters) {
      const units = [];
      quarters.forEach((q) => {
        q.weeks.forEach((w) => {
          units.push({ label: `${q.label} · ${w.label}`, words: w.words, date: w.date || null });
        });
      });
      return units;
    }

    function buildQuarterUnits(quarters) {
      return quarters.map((q) => ({
        label: q.label,
        words: q.weeks.reduce((acc, w) => acc.concat(w.words), [])
      }));
    }

    function findThisWeekIndex() {
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      let best = null;
      let earliestFuture = null;

      weeklyUnits.forEach((u, i) => {
        if (!u.date) return;
        const d = new Date(`${u.date}T00:00:00`);
        if (d <= today) {
          if (!best || d > best.date) best = { index: i, date: d };
        } else if (!earliestFuture || d < earliestFuture.date) {
          earliestFuture = { index: i, date: d };
        }
      });

      if (best) return best.index;
      if (earliestFuture) return earliestFuture.index;
      return 0;
    }

    function renderSpotCheck() {
      modalBody.innerHTML = '';
      quarters.forEach((q) => {
        const qEl = document.createElement('div');
        qEl.className = 'modal-quarter';
        qEl.innerHTML = q.source
          ? `${q.label} <a class="modal-source-link" href="${q.source}" target="_blank" rel="noopener">Source ↗</a>`
          : q.label;
        modalBody.appendChild(qEl);

        q.weeks.forEach((w) => {
          const wEl = document.createElement('div');
          wEl.className = 'modal-week';
          wEl.innerHTML = `
            <div><span class="modal-week-label">${w.label}</span> <span class="modal-week-date">${w.date ? `(${w.date})` : '(no date set)'}</span></div>
            <div class="modal-week-words">${w.words.join(', ')}</div>
          `;
          modalBody.appendChild(wEl);
        });
      });
    }

    function formatDate(dateStr) {
      const d = new Date(`${dateStr}T00:00:00`);
      return d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
    }

    function populateUnitSelect() {
      const units = currentUnits();
      unitSelect.innerHTML = '';
      units.forEach((u, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = u.date ? `${u.label} (${formatDate(u.date)})` : u.label;
        unitSelect.appendChild(opt);
      });
    }

    function saveState() {
      try {
        const units = currentUnits();
        sessionStorage.setItem(STORAGE_KEY, JSON.stringify({
          mode,
          unitIndex,
          unitLabel: units[unitIndex] && units[unitIndex].label,
          roundQueue,
          currentWord,
          gotCount,
          missCount,
          roundTotal,
          finished
        }));
      } catch (e) {
        // sessionStorage unavailable (private mode, etc) — just skip persistence
      }
    }

    function loadState() {
      try {
        const raw = sessionStorage.getItem(STORAGE_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(word) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(word);
      utter.rate = 0.85;
      window.speechSynthesis.speak(utter);
    }

    function startRound(index) {
      unitIndex = index;
      const words = currentUnits()[unitIndex].words;
      roundQueue = shuffle(words);
      roundTotal = words.length;
      gotCount = 0;
      missCount = 0;
      finished = false;
      doneScreen.hidden = true;
      quiz.hidden = false;
      nextCard();
    }

    function nextCard() {
      if (roundQueue.length === 0) {
        finishRound();
        return;
      }
      currentWord = roundQueue.shift();
      wordDisplay.textContent = currentWord;
      updateProgress();
      saveState();
    }

    function updateProgress() {
      const remaining = roundQueue.length + 1;
      progressLabel.textContent = `${remaining} word${remaining === 1 ? '' : 's'} to go`;
      gotCountEl.textContent = gotCount;
      missCountEl.textContent = missCount;
    }

    function renderDone() {
      quiz.hidden = true;
      doneScreen.hidden = false;
      doneStats.textContent = `${roundTotal} words • ${missCount} needed another try`;
    }

    function finishRound() {
      finished = true;
      renderDone();
      saveState();
    }

    function restoreState(saved) {
      unitIndex = saved.unitIndex;
      roundQueue = saved.roundQueue;
      currentWord = saved.currentWord;
      gotCount = saved.gotCount;
      missCount = saved.missCount;
      roundTotal = saved.roundTotal;
      finished = saved.finished;

      if (finished) {
        renderDone();
      } else {
        quiz.hidden = false;
        doneScreen.hidden = true;
        wordDisplay.textContent = currentWord;
        updateProgress();
      }
    }

    speakBtn.addEventListener('click', () => speak(currentWord));

    gotBtn.addEventListener('click', () => {
      gotCount++;
      nextCard();
    });

    missBtn.addEventListener('click', () => {
      missCount++;
      roundQueue.push(currentWord);
      roundQueue = shuffle(roundQueue);
      nextCard();
    });

    againBtn.addEventListener('click', () => {
      startRound(unitIndex);
    });

    modeSelect.addEventListener('change', () => {
      mode = modeSelect.value;
      populateUnitSelect();
      unitSelect.value = 0;
      startRound(0);
    });

    unitSelect.addEventListener('change', () => {
      startRound(parseInt(unitSelect.value, 10));
    });

    resetBtn.addEventListener('click', () => {
      startRound(unitIndex);
    });

    thisWeekBtn.addEventListener('click', () => {
      mode = 'weekly';
      modeSelect.value = mode;
      populateUnitSelect();
      const idx = findThisWeekIndex();
      unitSelect.value = idx;
      startRound(idx);
    });

    spotCheckBtn.addEventListener('click', () => {
      renderSpotCheck();
      modalBackdrop.hidden = false;
    });

    modalClose.addEventListener('click', () => {
      modalBackdrop.hidden = true;
    });

    modalBackdrop.addEventListener('click', (e) => {
      if (e.target === modalBackdrop) modalBackdrop.hidden = true;
    });

    fetch('words.json', { cache: 'no-store' })
      .then((res) => {
        if (!res.ok) throw new Error('Could not load words.json');
        return res.json();
      })
      .then((data) => {
        quarters = data.quarters || [];
        if (quarters.length === 0) throw new Error('No quarters found in words.json');
        weeklyUnits = buildWeeklyUnits(quarters);
        quarterUnits = buildQuarterUnits(quarters);

        loadingMsg.hidden = true;
        pickerRow.hidden = false;

        const saved = loadState();
        const savedUnits = saved && (saved.mode === 'weekly' ? weeklyUnits : quarterUnits);
        const savedUnit = savedUnits && savedUnits[saved.unitIndex];
        const savedMatches = savedUnit && savedUnit.label === saved.unitLabel;

        if (savedMatches) {
          mode = saved.mode;
          modeSelect.value = mode;
          populateUnitSelect();
          unitSelect.value = saved.unitIndex;
          restoreState(saved);
        } else {
          mode = 'weekly';
          modeSelect.value = mode;
          populateUnitSelect();
          unitSelect.value = 0;
          startRound(0);
        }
      })
      .catch((err) => {
        loadingMsg.hidden = true;
        errorMsg.hidden = false;
        errorMsg.textContent = `⚠️ ${err.message}`;
      });
  </script>
</body>

</html>
